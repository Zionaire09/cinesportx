<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <!--
      This policy protects this static wrapper document only. It does not
      become the CSP of the cross-origin player loaded inside the iframe.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; frame-src https://vidsrc.mov; base-uri 'none'; form-action 'none'; object-src 'none'">
    <title>Armageddon Player</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      #error { box-sizing: border-box; display: none; height: 100%; padding: 1.5rem; align-items: center; justify-content: center; color: #fff; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    </style>
    <script src="./armageddon-player-wrapper.js" defer></script>
  </head>
  <body>
    <div id="error" role="alert"></div>
  </body>
</html>
